<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#18231a">
  <title>Refresh Slice by STA</title>
  <style>
    body{margin:0;background:#eef0e8;color:#18231a;font:17px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}
    main{max-width:380px;margin:24px;padding:32px;background:white;border-radius:24px}
    h1{font-size:28px;line-height:1.15;margin:0 0 16px}p{margin:12px 0}button{border:0;border-radius:30px;padding:14px 24px;background:#d4f04c;color:#18231a;font:600 16px system-ui;cursor:pointer}
  </style>
</head>
<body><main><h1>Refreshing Slice</h1><p id="status" role="status">Getting the latest player photo controls…</p><p>Your sign-in and saved Tennis records stay in place.</p><button id="retry" hidden>Try again</button></main>
<script>
  async function refresh() {
    const retry = document.getElementById('retry');
    retry.hidden = true;
    try {
      // Clear only Slice's app files. Never clear cookies, local storage or records.
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.filter((key) => key.startsWith('slice-v')).map((key) => caches.delete(key)));
      }
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then((registration) => registration?.update()).catch(() => {});
      location.replace('/#/players');
    } catch {
      document.getElementById('status').textContent = 'Could not refresh. Check your connection and try again.';
      retry.hidden = false;
    }
  }
  document.getElementById('retry').addEventListener('click', refresh);
  refresh();
</script></body>
</html>
